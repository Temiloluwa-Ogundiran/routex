x-backend-env: &backend-env
  DB_URL: ${DB_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/routex}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  AGG_SECRET: ${AGG_SECRET:-}
  AUTH_SECRET: ${AUTH_SECRET:-}
  SERVER_URL: ${SERVER_URL:-https://routexapi.xoroai.cloud}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://routex.xoroai.cloud}
  CHECKOUT_URL: ${CHECKOUT_URL:-https://routex.xoroai.cloud}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  AUTH_EMAIL: ${AUTH_EMAIL:-}
  RECEIPT_EMAIL: ${RECEIPT_EMAIL:-}
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
  FLTW_SECRET_KEY: ${FLTW_SECRET_KEY:-}
  FLTW_SECRET_HASH: ${FLTW_SECRET_HASH:-}
  KORA_SECRET_KEY: ${KORA_SECRET_KEY:-}
  INTERSWITCH_MERCHANT_CODE: ${INTERSWITCH_MERCHANT_CODE:-}
  INTERSWITCH_PAY_ITEM_ID: ${INTERSWITCH_PAY_ITEM_ID:-}
  INTERSWITCH_CLIENT_ID: ${INTERSWITCH_CLIENT_ID:-}
  INTERSWITCH_SECRET_KEY: ${INTERSWITCH_SECRET_KEY:-}
  PROXY_URL: ${PROXY_URL:-}
  PROXY_USERNAME: ${PROXY_USERNAME:-}
  PROXY_PASSWORD: ${PROXY_PASSWORD:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: routex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *backend-env
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  beat:
    build:
      context: .
      dockerfile: Dockerfile.beat
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    environment:
      ROUTEX_API_BASE_URL: http://api:8000
      ROUTEX_PLAYGROUND_SECRET_KEY: ${ROUTEX_PLAYGROUND_SECRET_KEY:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
